    <style>
        /* =========================================
           RESET E BACKGROUND
        ========================================= */

        label { font-weight: 700; color: #2C75B9; margin-bottom: 5px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
        .form-control { border-radius: 6px !important; border: 1px solid #c0c6cc !important; padding: 6px 12px !important; height: 36px !important; line-height: 1.42857143 !important; font-size: 13px !important; color: #444 !important; transition: all 0.3s ease; display: block; width: 100%; background-color: #fff; box-sizing: border-box; font-family: inherit; }
        textarea.form-control { height: auto !important; min-height: 100px !important; resize: vertical; padding: 10px 12px !important; }
        select.form-control { appearance: auto; }
        .form-control:focus { border-color: #F29620; box-shadow: 0 0 0 3px rgba(242, 150, 32, 0.15); outline: none; }
        .form-control[readonly], .form-control[disabled] { background-color: #f4f6f9 !important; color: #7a828a !important; border-color: #e2e7ec !important; cursor: not-allowed; font-weight: 500; }
        .check-movimento { display: flex; align-items: center; margin-top: 15px; margin-bottom: 10px; }
        .check-movimento input { margin: 0; margin-right: 8px; width: 16px; height: 16px; cursor: pointer; }
        .check-movimento label { margin: 0; font-size: 13px; color: #444; text-transform: uppercase; font-weight: 700; cursor: pointer; }
        
        /* LUPA E ZOOM */
        .input-group { display: flex !important; width: 100% !important; align-items: stretch !important; height: 36px !important; }
        .input-group .form-control { border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; flex: 1 !important; margin: 0 !important; z-index: 1; height: 36px !important; }
        .input-group-addon .fluigicon { display: none !important; }
        .input-group-addon { background-color: #f4f6f9 !important; border: 1px solid #c0c6cc !important; border-left: none !important; border-radius: 0 6px 6px 0 !important; width: 40px !important; height: 36px !important; cursor: pointer; padding: 0 !important; margin: 0 !important; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="16" height="16"><path fill="%232C75B9" d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>') !important; background-repeat: no-repeat !important; background-position: center !important; background-size: 16px !important; }

        .select2-container .select2-search--inline .select2-search__field { margin: 0 !important; height: 34px !important; line-height: 34px !important; font-size: 13px !important; padding-left: 4px !important; }

        .select2-container--default .select2-selection--single .select2-selection__rendered { line-height: normal !important; padding: 0 4px !important; font-size: 13px !important; color: #444 !important; width: 100%; }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 34px !important; top: 1px !important; }
        
        /* =========================================
           ESTILOS DOS ANEXOS E BOTÕES "INJETADOS"
        ========================================= */
        .caixa-anexo { background-color: #f8fafd; border: 2px dashed #b1c8df; border-radius: 10px; padding: 20px; margin-top: 15px; }
        .caixa-anexo label { color: #1e5283 !important; font-size: 14px; display: block; margin-bottom: 10px; }
        .fluigFormAttachmentComponent { display: flex; width: 100%; gap: 8px; align-items: center; }
        .fluigFormAttachmentComponent input { flex: 1; min-width: 0; }
        .fluigFormAttachmentComponent_buttons { flex-shrink: 0; display: flex; gap: 5px; }
        
        .fluigFormAttachmentComponent_buttons .btn i { display: none !important; }
        .fluigFormAttachmentComponent_buttons .btn, .btn-anexo-historico {
            width: 32px !important; height: 32px !important;
            background-repeat: no-repeat !important; background-position: center !important; background-size: 14px !important;
            padding: 0 !important; border-radius: 4px !important; transition: all 0.2s ease; cursor: pointer;
        }

        .tabelas-ocultas { height: 0px; overflow: hidden; visibility: hidden; }

        input[type="checkbox"][disabled]:checked { opacity: 1; accent-color: #4cae4c; }

<body>
    <form name="form" role="form">
        <input type="hidden" id="TxtChapa" name="TxtChapa" />
        <input type="hidden" id="CodPessoa" name="CodPessoa" />
        <input type="hidden" id="TxtNomeCol" name="TxtNomeCol" />
        <input type="hidden" id="DtLimitFer" name="DtLimitFer" />
        <input type="hidden" id="txtDtAdm" name="txtDtAdm" />
        <input type="hidden" id="txtMembCipaCod" name="txtMembCipaCod" />
        <input type="hidden" id="CodTipo" name="CodTipo" />
        <input type="hidden" id="CodCategoria" name="CodCategoria" />
        <input type="hidden" id="txtSalOrigem" name="txtSalOrigem" />
        <input type="hidden" id="TEMPRAZOCONTR" name="TEMPRAZOCONTR" />
        <input type="hidden" id="FIMPRAZOCONTR" name="FIMPRAZOCONTR" />
        <input type="hidden" id="NROFICHAREG" name="NROFICHAREG" />
        <input type="hidden" id="CODRECEBIMENTO" name="CODRECEBIMENTO" />
        <input type="hidden" id="CodFilialDestino" name="CodFilialDestino" />
        
        <!-- VARIÁVEIS OCULTAS -->
        <input type="text" id="cpRespGestor2" name="cpRespGestor2" style="display:none;" />
        <input type="text" id="cpDecisaoRH" name="cpDecisaoRH" style="display:none;" />
        <input type="text" id="cpParecercol2" name="cpParecercol2" style="display:none;" />
        <input type="text" id="cpFlagNovaRodada" name="cpFlagNovaRodada" style="display:none;" />
        
        <div class="container-fluid">
            
            <div class="page-header">
                <h2>MOVIMENTAÇÃO DE PESSOAL</h2>
            </div>
            
            <div class="panel panel-default" id="painelSolicitante">
                <div class="panel-heading">
                    <h3 class="panel-title"><i class="fluigicon fluigicon-user-config fluigicon-sm"></i> Dados do Solicitante</h3>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-3 form-group">
                            <label for="nSolicitacao">N. Solicitação</label>
                            <input type="text" class="form-control" name="nSolicitacao" id="nSolicitacao" readonly>
                        </div>
                        <div class="col-md-3 form-group">
                            <label for="dataAbertura">Data Abertura</label>
                            <input type="text" class="form-control" name="dataAbertura" id="dataAbertura" readonly>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="solicitante">Solicitante</label>
                            <input type="text" class="form-control" name="solicitante" id="solicitante" readonly>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="panel panel-primary" id="painelColaborador">
                <div class="panel-heading">
                    <h3 class="panel-title"><i class="fluigicon fluigicon-user fluigicon-sm"></i> Dados do Colaborador</h3>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="empresaColab">Empresa-Filial</label>
                            <input type="zoom" id="empresaColab" name="empresaColab"
                                   data-zoom="{
                                       'displayKey':'NOME',
                                       'datasetId':'ds_empresaFilial',
                                       'maximumSelectionLength':'1',
                                       'placeholder':'Pesquise a coligada...',
                                       'fields':[
                                           {'field':'COLIGADA', 'label':'Coligada'},
                                           {'field':'NOME', 'label':'Nome da Empresa', 'standard':'true','search':'true'},
                                           {'field':'CODFILIAL', 'label':'Filial'},
                                           {'field':'NOMEFANTASIAFILIAL', 'label':'Nome Filial', 'search':'true'}
                                       ]
                                   }" class="form-control" />
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="dptoObraColab">Dpto/Obra</label>
                            <input type="zoom" id="dptoObraColab" name="dptoObraColab"
                                   data-zoom="{
                                       'displayKey':'DESCRICAO',
                                       'datasetId':'ds_dptoObra',
                                       'maximumSelectionLength':'1',
                                       'placeholder':'Pesquise o dpto/obra...',
                                       'fields':[
                                           {'field':'CODIGO', 'label':'Código'},
                                           {'field':'DESCRICAO', 'label':'Descrição do Dpto/Obra', 'standard':'true', 'search':'true'},
                                           {'field':'CODFILIAL', 'visible':'false'},
                                           {'field':'CODCOLIGADA', 'visible':'false'}
                                       ]
                                   }" class="form-control" />
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="nomeColaborador">Nome do Colaborador</label>
                            <input type="zoom" id="nomeColaborador" name="nomeColaborador"
                                   data-zoom="{
                                       'displayKey':'NOME',
                                       'datasetId':'ds_colaboradores',
                                       'maximumSelectionLength':'1',
                                       'placeholder':'Pesquise o colaborador...',
                                       'fields':[
                                           {'field':'CHAPA', 'label':'Matrícula'},
                                           {'field':'NOME', 'label':'Nome', 'standard':'true', 'search':'true'},
                                           {'field':'CARGO', 'visible':'false'},
                                           {'field':'DATAADMISSAO', 'visible':'false'},
                                           {'field':'TIPOFUNCIONARIO', 'visible':'false'},
                                           {'field':'SITUACAO', 'visible':'false'},
                                           {'field':'CODCOLIGADA', 'visible':'false'},
                                           {'field':'CODFILIAL', 'visible':'false'},
                                           {'field':'CODSECAO', 'visible':'false'},
                                           {'field':'CODFUNCAO', 'visible':'false'},
                                           {'field':'CBO2002', 'visible':'false'},
                                           {'field':'CODHORARIO', 'visible':'false'},
                                           {'field':'HORARIO', 'visible':'false'},
                                           {'field':'INDINICIOHOR', 'visible':'false'},
                                           {'field':'COLUMN1', 'visible':'false'},
                                           {'field':'SALARIO', 'visible':'false'},
                                           {'field':'JORNADAMENSAL', 'visible':'false'}
                                       ]
                                   }" class="form-control" />
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-2 form-group">
                            <label for="matricula">Matrícula</label>
                            <input type="text" class="form-control" name="matricula" id="matricula" readonly>
                        </div>
                        <div class="col-md-3 form-group">
                            <label for="dataAdmissao">Data da Admissão</label>
                            <input type="text" class="form-control" name="dataAdmissao" id="dataAdmissao" readonly>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="cargo">Cargo Atual</label>
                            <input type="text" class="form-control" name="cargo" id="cargo" readonly>

                        </div>

                </div>
            </div>
            
        </div>
    </form>

<script type="text/javascript">
    $(document).ready(function() {
        
        setTimeout(function() {
            if(window["dptoObraColab"]) window["dptoObraColab"].disable(true);
            if(window["nomeColaborador"]) window["nomeColaborador"].disable(true);
            if(window["CodNovaSecao"]) window["CodNovaSecao"].disable(true);
            if(window["CpIndiceCodHorario"]) window["CpIndiceCodHorario"].disable(true);
            
            var atvAtual = (typeof ATIVIDADE_ATUAL !== 'undefined') ? ATIVIDADE_ATUAL : 0;
            var modo = (typeof MODO_FORMULARIO !== 'undefined') ? MODO_FORMULARIO : 'ADD';
            
            // Exibe a Flag de Validação caso esteja com o BPO (Atividade 4) ou Histórico (VIEW)
            if (atvAtual >= 4 || modo === "VIEW") {
                $('.checkbox-validacao-bpo').show();
            }

            // Oculta a lixeira padrão do pai-filho
            $(".fluigicon-trash").hide();
            
            // CONSTRUÇÃO LÓGICA DO HISTÓRICO (Ignorado em Modo Visualização)
            if (modo !== "VIEW") {
                var rows = $("input[id*='tipoInteracao___']");
                var totalRows = rows.length;
                var lastType = totalRows > 0 ? rows.last().val() : "";

                if (atvAtual == 0 || atvAtual == 3) {
                    if (totalRows === 0) adicionarInteracao("SOLICITANTE");
                } 
                else if (atvAtual == 4) {
                    if (lastType !== "BPO") adicionarInteracao("BPO");
                } 
                else if (atvAtual == 6) {
                    if (lastType !== "CORRECAO") adicionarInteracao("CORRECAO");
                }
            }
            
            // Exibe Ação Solicitante no fim
            if (atvAtual == 11 && modo !== "VIEW") {
                $("#divReabertura").show();
            } else {
                $("#divReabertura").hide();
            }
            
            // PRIMEIRO: Congela a linha do Solicitante enquanto ela ainda existe na tabela Pai x Filho
            aplicarCongelamento();

            // SEGUNDO: Recorta o painel já congelado e injeta na Timeline cronológica
            restaurarEstilosPaineisDeObservacao();

        }, 1200);

        if (!$("#dtMudanca").val()) {
            var dataAtual = new Date();
            var ano = dataAtual.getFullYear();
            var mes = ("0" + (dataAtual.getMonth() + 1)).slice(-2);
            $("#dtMudanca").val(ano + "-" + mes + "-01");
        }

        var $cb1 = $('#Ckb1'), $cb2 = $('#Ckb2'), $cb3 = $('#Ckb3'), $cb5 = $('#Ckb5');
        var $blocoData = $('#blocoDataMudanca');

        function atualizarDataMudanca() {
            if ($cb1.is(':checked')) { $blocoData.insertAfter('.NovaSecao hr').slideDown(300); }
            else if ($cb2.is(':checked')) { $blocoData.insertAfter('.NovaFuncao hr').slideDown(300); }
            else if ($cb3.is(':checked')) { $blocoData.insertAfter('.NovoHorario hr').slideDown(300); }
            else if ($cb5.is(':checked')) { $blocoData.insertAfter('.NovoSalario hr').slideDown(300); }
            else {
                $blocoData.slideUp(300, function() {
                    var dataAtual = new Date();
                    var ano = dataAtual.getFullYear();
                    var mes = ("0" + (dataAtual.getMonth() + 1)).slice(-2);
                    $('#dtMudanca').val(ano + "-" + mes + "-01");
                });
            }
        }

        function configurarToggleCheckbox($checkbox, classeAlvo) {
            var $alvo = $('.' + classeAlvo);
            if($checkbox.is(':checked')) { $alvo.show(); } else { $alvo.hide(); }
            
            $checkbox.on('change', function() {
                if($(this).is(':checked')) { $alvo.slideDown(300); } else { $alvo.slideUp(300); }
                atualizarDataMudanca();
            });
        }

        configurarToggleCheckbox($cb1, 'NovaSecao');
        configurarToggleCheckbox($cb2, 'NovaFuncao');
        configurarToggleCheckbox($cb3, 'NovoHorario');
        configurarToggleCheckbox($cb5, 'NovoSalario');
        
        atualizarDataMudanca();
        
        $('#NovoSalario').on('keyup', function() {
            var valor = $(this).val().replace(/\D/g, '');
            if (valor.length > 0) {
                valor = (valor / 100).toFixed(2) + '';
                valor = valor.replace('.', ',');
                valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
                $(this).val('R$ ' + valor);
            } else {
                $(this).val('');
            }
        });

        $('#cpNovaJornadaMensal').on('input', function() {
            var v = $(this).val().replace(/\D/g, '');
            if (v.length > 5) v = v.substring(0, 5);
            if (v.length > 3) { $(this).val(v.substring(0, 3) + ':' + v.substring(3, 5)); }
            else { $(this).val(v); }
        });
    });

    // ========================================================
    // FUNÇÕES DE CRIAÇÃO E CONGELAMENTO DO HISTÓRICO
    // ========================================================
    
    // Mostra ou Esconde o campo "Parecer do BPO" baseado na Decisão
    window.tratarAcaoBPO = function(obj) {
        var $painel = $(obj).closest('.panel-body');
        var valor = $(obj).val();
        
        if(valor === 'Incorreto') {
            $painel.find('.linha-parecer-bpo').slideDown(300);
        } else {
            $painel.find('.linha-parecer-bpo').slideUp(300);
            // Limpa o conteúdo se o usuário mudar de ideia para "Correto"
            $painel.find('textarea[name^="cpParecercol2_tb"]').val('').trigger('change');
            $('#cpParecercol2').val('');
        }
    }

    function adicionarInteracao(tipo) {
        var rowId = wdkAddChild('tbInteracoes');
        $(".fluigicon-trash").hide(); 
        
        var $linha = $("#tipoInteracao___" + rowId).closest("tr");
        $("#tipoInteracao___" + rowId).val(tipo);

        $linha.find(".painel-solicitante-dinamico, .painel-bpo-dinamico, .painel-correcao-dinamico").hide();

        if (tipo === "SOLICITANTE") {
            $linha.find(".painel-solicitante-dinamico").show();
            $("#cpAnexoGeral_tb___" + rowId).fluigFormAttachment({ showActionButton: true, prefixName: true });
        } else if (tipo === "CORRECAO") {
            $linha.find(".painel-correcao-dinamico").show();
            $("#cpAnexoCorrecao_tb___" + rowId).fluigFormAttachment({ showActionButton: true, prefixName: true });
        } else if (tipo === "BPO") {
            $linha.find(".painel-bpo-dinamico").show();
            $("#cpRespGestor2_tb___" + rowId).val($("#cpRespGestor2").val());
        }
    }

    // Função universal e segura para ler dados em ADD/MOD e VIEW
    function getFieldValue($container, fieldBaseName) {
        var $el = $container.find("[id*='" + fieldBaseName + "___']");
        if ($el.length === 0) return "";
        var val = "";
        
        // Verifica que tipo de campo o Fluig renderizou
        if ($el.is("input") || $el.is("textarea")) {
            val = $el.val();
        } else if ($el.is("select")) {
            val = $el.val();
            // Tenta pegar o texto visível se o valor for vazio, muito comum no VIEW
            if (!val) val = $el.find("option:selected").text();
        } else {
            // Se virou span/div no VIEW
            val = $el.text();
        }
        return (val || "").trim();
    }

    function aplicarCongelamento() {
        var atvAtual = (typeof ATIVIDADE_ATUAL !== 'undefined') ? ATIVIDADE_ATUAL : 0;
        var modo = (typeof MODO_FORMULARIO !== 'undefined') ? MODO_FORMULARIO : 'ADD';

        if (modo == "VIEW" || atvAtual == 4 || atvAtual == 6 || atvAtual == 11) {
            var secoesFixas = ["#painelSolicitante", "#painelColaborador", "#painelMovimentacoes", "#divReabertura"];
            $.each(secoesFixas, function(i, secao) {
                $(secao).find("input, select, textarea").prop("readonly", true).css("pointer-events", "none").css("background-color", "#f4f6f9");
                $(secao).find("input[type=checkbox]").prop("disabled", true);
            });
            
            // Lógica Exclusiva BPO: Descongelar as Flags de Validação (Somente Atividade 4)
            if (atvAtual == 4 && modo !== "VIEW") {
                $(".checkbox-validacao-bpo input[type='checkbox']").prop("disabled", false).prop("readonly", false).css({"pointer-events": "auto", "background-color": "transparent"});
            }

            var zooms = ["empresaColab", "dptoObraColab", "nomeColaborador", "CodNovaSecao", "txtNovoFuncao", "txtMotivoFuncao", "CpNovoHorario", "CpIndiceCodHorario", "txtMotivoSalario", "txtMotivoSecao"];
            zooms.forEach(function(z) { if(window[z]) window[z].disable(true); });
        }

        // Lê pelas classes no view
        var $todasAsLinhas = $(".td-interacao");
        var totalLinhas = $todasAsLinhas.length;

        $todasAsLinhas.each(function(index) {
            var $linhaAtual = $(this);
            
            // Pula a linha template no ADD/MOD
            var isTemplate = false;
            var $idField = $linhaAtual.find("[id*='cpObservacoesGerais_tb___']").first();
            if ($idField.length > 0) {
                var idVal = $idField.attr("id");
                if (modo !== "VIEW" && idVal && idVal.indexOf("___") === idVal.length - 3) isTemplate = true;
            }
            if (isTemplate) return;

            var isLast = (index === totalLinhas - 1);
            
            // Leitura Segura
            var obsGeral = getFieldValue($linhaAtual, "cpObservacoesGerais_tb");
            var anexoGeral = getFieldValue($linhaAtual, "cpAnexoGeral_tb");
            var parecerBPO = getFieldValue($linhaAtual, "cpParecercol2_tb");
            var decisaoBPO = getFieldValue($linhaAtual, "cpDecisaoRH_tb");
            var obsCor = getFieldValue($linhaAtual, "cpObservacoesCorrecao_tb");
            var anexoCor = getFieldValue($linhaAtual, "cpAnexoCorrecao_tb");
            var tipo = getFieldValue($linhaAtual, "tipoInteracao");

            if (tipo === "") {
                if (obsCor !== "" || anexoCor !== "") tipo = "CORRECAO";
                else if (parecerBPO !== "" || (decisaoBPO !== "" && decisaoBPO !== "Selecione...")) tipo = "BPO";
                else if (obsGeral !== "" || anexoGeral !== "") tipo = "SOLICITANTE";
            }

            if (tipo === "") return;

            var congelarLinha = false;
            
            // A MÁGICA ACONTECE AQUI: A linha do solicitante (Observações Gerais) SEMPRE congela se já não for a etapa inicial
            if (tipo === "SOLICITANTE" && (atvAtual == 4 || atvAtual == 6 || atvAtual == 11 || modo === "VIEW")) {
                congelarLinha = true;
            } 
            else if (modo === "VIEW") {
                congelarLinha = true;
            } else if (atvAtual == 4) {
                congelarLinha = !(isLast && tipo === "BPO");
            } else if (atvAtual == 6) {
                congelarLinha = !(isLast && tipo === "CORRECAO");
            } else if (atvAtual == 11) {
                congelarLinha = true;
            }

            if (congelarLinha) {
                $linhaAtual.find("input, select, textarea").prop("readonly", true).css("pointer-events", "none").css("background-color", "#f4f6f9");
                $linhaAtual.find("select").prop("disabled", true);
                
                if (tipo === "SOLICITANTE" || tipo === "CORRECAO") {
                    var isCorrecao = (tipo === "CORRECAO");
                    var nomeArquivo = isCorrecao ? anexoCor : anexoGeral;
                    
                    $linhaAtual.find(".fluigFormAttachmentBtnDeleteFile, .fluigFormAttachmentBtnUploadFile").hide();
                    
                    if (nomeArquivo !== "") {
                        $linhaAtual.find(".row-anexo-interno").show();
                        $linhaAtual.find(".area-botoes-anexo").show();
                        var $btnVis = $linhaAtual.find(".btn-visualizar-injetado");
                        $btnVis.show();
                        
                        $btnVis.off("click").on("click", function() {
                            abrirAnexoFluigNativo(nomeArquivo);
                        });
                    } else {
                        $linhaAtual.find(".row-anexo-interno").hide();
                    }
                }
            }
        });
    }

    function restaurarEstilosPaineisDeObservacao() {
        var contSol = 0;
        var contBPO = 0;
        var contCor = 0;
        var modo = (typeof MODO_FORMULARIO !== 'undefined') ? MODO_FORMULARIO : 'ADD';
        
        var timeline = $("#historico-timeline");
        
        // Agora busca apenas pela classe para não falhar se o ID 'tbInteracoes' não for gerado no view
        var $todasAsLinhas = $(".td-interacao");
        var totalLinhas = $todasAsLinhas.length;

        $todasAsLinhas.each(function(index) {
            var $linha = $(this);
            
            // Pula a linha template no ADD/MOD
            var isTemplate = false;
            var $idField = $linha.find("[id*='cpObservacoesGerais_tb___']").first();
            if ($idField.length > 0) {
                var idVal = $idField.attr("id");
                if (idVal && idVal.indexOf("___") === idVal.length - 3) {
                    isTemplate = true;
                }
            }
            if (modo !== "VIEW" && isTemplate) return;

            var isLast = (index === totalLinhas - 1);
            
            $linha.find(".painel-solicitante-dinamico, .painel-bpo-dinamico, .painel-correcao-dinamico").hide();

            // Leitura Segura
            var obsGeral = getFieldValue($linha, "cpObservacoesGerais_tb");
            var anexoGeral = getFieldValue($linha, "cpAnexoGeral_tb");
            var parecerBPO = getFieldValue($linha, "cpParecercol2_tb");
            var decisaoBPO = getFieldValue($linha, "cpDecisaoRH_tb");
            var obsCor = getFieldValue($linha, "cpObservacoesCorrecao_tb");
            var anexoCor = getFieldValue($linha, "cpAnexoCorrecao_tb");
            var tipo = getFieldValue($linha, "tipoInteracao");
            
            // Fallback dedutivo
            if (tipo === "") {
                if (obsCor !== "" || anexoCor !== "") tipo = "CORRECAO";
                else if (parecerBPO !== "" || (decisaoBPO !== "" && decisaoBPO !== "Selecione...")) tipo = "BPO";
                else if (obsGeral !== "" || anexoGeral !== "") tipo = "SOLICITANTE";
            }

            var temConteudo = false;
            if (tipo === "SOLICITANTE" && (obsGeral !== "" || anexoGeral !== "")) temConteudo = true;
            
            var temDecisao = (decisaoBPO !== "" && decisaoBPO !== "Selecione...");
            if (tipo === "BPO" && (parecerBPO !== "" || temDecisao)) temConteudo = true;
            
            if (tipo === "CORRECAO" && (obsCor !== "" || anexoCor !== "")) temConteudo = true;

            if (!temConteudo) { 
                if (modo === "VIEW" || !isLast) { return; } 
            }

            var $painelAExtrair = null;
            
            if (tipo === "SOLICITANTE") {
                contSol++;
                $painelAExtrair = $linha.find(".painel-solicitante-dinamico");
                $painelAExtrair.show();
                $painelAExtrair.find(".titulo-painel-solicitante").text("Observações e Anexos");

            } else if (tipo === "CORRECAO") {
                contCor++;
                $painelAExtrair = $linha.find(".painel-correcao-dinamico");
                $painelAExtrair.show();
                $painelAExtrair.find(".titulo-painel-correcao").text("Correção " + contCor);

            } else if (tipo === "BPO") {
                contBPO++;
                $painelAExtrair = $linha.find(".painel-bpo-dinamico");
                $painelAExtrair.show();
                $painelAExtrair.find(".titulo-painel-bpo").text("Operação IRHO " + contBPO);
                
                // Exibe o campo de Parecer no histórico apenas se tiver sido preenchido
                if (parecerBPO !== "") {
                    $painelAExtrair.find(".linha-parecer-bpo").show();
                } else {
                    $painelAExtrair.find(".linha-parecer-bpo").hide();
                }
            }
            
            // Extrai o painel formatado para a Div de Timeline Limpa (Forçando a exibição com !important do jQuery)
            if ($painelAExtrair && $painelAExtrair.length > 0) {
                $painelAExtrair.css({"margin-bottom": "0", "display": "block", "visibility": "visible"});
                timeline.append($painelAExtrair);
            }
        });
    }
    
    function abrirAnexoFluigNativo(fileName) {
        try {
            if (!parent.ECM || !parent.ECM.attachmentTable) return;

            var attachIndex = parent.ECM.attachmentTable.getData().findIndex(function(a) { return a.description === fileName; });

            if (attachIndex === -1) {
                FLUIGC.toast({title: "Atenção", message: "Anexo não encontrado. Acesse pela aba 'Anexos'.", type: "warning"});
                return;
            }

            var e = parent.ECM.attachmentTable.getRow(attachIndex);
            
            if (e.documentId) {
                var t = parent.WCMAPI ? parent.WCMAPI.tenantCode || parent.WCMAPI.organizationId : 1;
                parent.WKFViewAttachment.openAttachmentView(t, e.documentId, e.version);
            } else {
                FLUIGC.toast({title: "Aviso", message: "Arquivo não sincronizado. Envie a solicitação primeiro.", type: "info"});
            }
        } catch(e) {
            console.error(e);
            FLUIGC.toast({title: "Erro", message: "Use a aba 'Anexos' na barra superior.", type: "danger"});
        }
    }

    // ========================================================
    // INTEGRAÇÕES E ZOOMS MANTIDOS INTACTOS
    // ========================================================

    function buscarGestorAjax(codSecao, codColigada, callbackSucesso, callbackErro) {
        var requestData = { "name": "ds_gestoresColaboradoresSecao", "fields": [], "constraints": [ { "_field": "CODSECAO", "_initialValue": String(codSecao).trim(), "_finalValue": String(codSecao).trim(), "_type": 1, "_likeSearch": false }, { "_field": "CODCOLIGADA", "_initialValue": String(codColigada).trim(), "_finalValue": String(codColigada).trim(), "_type": 1, "_likeSearch": false } ], "order": [] };
        var processarRetorno = function(data) { var content = []; if (data && Array.isArray(data.values)) { content = data.values; } else if (data && data.content && Array.isArray(data.content.values)) { content = data.content.values; } else if (data && Array.isArray(data.content)) { content = data.content; } else if (Array.isArray(data)) { content = data; } callbackSucesso(content); };
        var tentarFallback = function() { $.ajax({ url: '/ecm/api/rest/ecm/dataset/getDataset', type: 'POST', contentType: 'application/json', data: JSON.stringify(requestData), success: processarRetorno, error: callbackErro }); };
        try { if (typeof window.parent !== 'undefined' && window.parent.WCMAPI) { window.parent.WCMAPI.Create({ url: "/api/public/ecm/dataset/datasets/", type: "POST", contentType: "application/json", data: JSON.stringify(requestData), success: processarRetorno, error: function(err) { tentarFallback(); } }); } else { tentarFallback(); } } catch(e) { tentarFallback(); }
    }

    function setSelectedZoomItem(selectedItem) {
        if (selectedItem.inputId == "empresaColab") {
            window["dptoObraColab"].disable(false);
            if(window["CodNovaSecao"]) window["CodNovaSecao"].disable(false);
            
            var filter = "CODCOLIGADA," + selectedItem.COLIGADA;
            if (selectedItem.CODFILIAL) { filter += ",CODFILIAL," + selectedItem.CODFILIAL; }
            reloadZoomFilterValues("dptoObraColab", filter);
            reloadZoomFilterValues("CodNovaSecao", filter);
        }

        if (selectedItem.inputId == "dptoObraColab") {
            window["nomeColaborador"].disable(false);
            reloadZoomFilterValues("nomeColaborador", "CODSECAO," + selectedItem.CODIGO);
            $("#txtCodSecaoOri").val((selectedItem.CODIGO || "") + " - " + (selectedItem.DESCRICAO || ""));
            $("#txtSecOrig").val(selectedItem.DESCRICAO || "");
        }
        
        if (selectedItem.inputId == "CodNovaSecao") {
            $("#DesNovaSecao").val(selectedItem.DESCRICAO || "");
            $("#cpNovoGestor").val("Buscando gestor...");
            
            setTimeout(function() {
                var codSecaoDest = Array.isArray(selectedItem.CODIGO) ? selectedItem.CODIGO[0] : selectedItem.CODIGO;
                var codColigadaDest = selectedItem.CODCOLIGADA || $("#empresaColab").val();
                if (codSecaoDest && codColigadaDest) {
                    buscarGestorAjax(codSecaoDest, codColigadaDest, function(content) {
                        if (content && content.length > 0) {
                            var row = content[0];
                            if (row.ERRO) return;
                            var codGestor = row.CHAPASUBST && String(row.CHAPASUBST) !== "null" ? String(row.CHAPASUBST).trim() : "";
                            var nomeGestor = row.NOME1 && String(row.NOME1) !== "null" ? String(row.NOME1).trim() : "";
                            if (codGestor !== "" && nomeGestor !== "") { $("#cpNovoGestor").val(codGestor + " - " + nomeGestor); $("#codGestorDestino").val(codGestor);
                            } else if (nomeGestor !== "") { $("#cpNovoGestor").val(nomeGestor);
                            } else if (codGestor !== "") { $("#cpNovoGestor").val(codGestor); $("#codGestorDestino").val(codGestor); }
                        } else { $("#cpNovoGestor").val("Nenhum gestor encontrado na tabela"); }
                    }, function(err) { console.error(err); });
                }
            }, 150);
        }

        if (selectedItem.inputId == "nomeColaborador") {
            $("#matricula").val(selectedItem.CHAPA || "");
            $("#cargo").val(selectedItem.CARGO || "");
            $("#dataAdmissao").val(selectedItem.DATAADMISSAO || "");
            $("#tipoFuncionario").val(selectedItem.TIPOFUNCIONARIO || "");
            $("#codSituacao").val(selectedItem.SITUACAO || "");
            $("#salarioColaborador").val(selectedItem.SALARIO || "");
            $("#horarioColaborador").val(selectedItem.HORARIO || "");
            $("#txtCodFuncao").val(selectedItem.CODFUNCAO || "");
            $("#CargoCol").val(selectedItem.CARGO || "");
            $("#cboFuncaoAtual").val(selectedItem.CBO2002 || "");
            $("#CodHorAtual").val(selectedItem.CODHORARIO || "");
            $("#DescHoraAtual").val(selectedItem.HORARIO || "");
            $("#IndiceAtual").val(selectedItem.INDINICIOHOR || "");
            $("#Salario").val(selectedItem.SALARIO || "");

            if(selectedItem.JORNADAMENSAL) {
                var jornadaMinutos = parseInt(selectedItem.JORNADAMENSAL, 10);
                var horas = Math.floor(jornadaMinutos / 60);
                var minutos = jornadaMinutos % 60;
                var formatada = ("000" + horas).slice(-3) + ":" + ("0" + minutos).slice(-2);
                $("#cpJornadaMensal").val(formatada);
                $("#cpNovaJornadaMensal").val(formatada);
                $("#cpJornadaFormatada").val(formatada);
            } else { $("#cpJornadaMensal, #cpNovaJornadaMensal").val(""); }

            $("#gestor").val("Buscando gestor...");
            
            setTimeout(function() {
                var codSecao = Array.isArray(selectedItem.CODSECAO) ? selectedItem.CODSECAO[0] : selectedItem.CODSECAO;
                var codColigada = Array.isArray(selectedItem.CODCOLIGADA) ? selectedItem.CODCOLIGADA[0] : selectedItem.CODCOLIGADA;
                if (codSecao && codColigada) {
                    buscarGestorAjax(codSecao, codColigada, function(content) {
                        if (content && content.length > 0) {
                            var row = content[0];
                            if (row.ERRO) { $("#gestor").val("Erro ao ler integração (F12)"); return; }
                            var codGestor = row.CHAPASUBST && String(row.CHAPASUBST) !== "null" ? String(row.CHAPASUBST).trim() : "";
                            var nomeGestor = row.NOME1 && String(row.NOME1) !== "null" ? String(row.NOME1).trim() : "";
                            if (codGestor !== "" && nomeGestor !== "") { $("#gestor").val(codGestor + " - " + nomeGestor);
                            } else if (nomeGestor !== "") { $("#gestor").val(nomeGestor);
                            } else if (codGestor !== "") { $("#gestor").val(codGestor);
                            } else { $("#gestor").val("Gestor cadastrado sem nome ou código"); }
                        } else { $("#gestor").val("Nenhum gestor encontrado na tabela"); }
                    }, function(err) { $("#gestor").val("Falha de comunicação (401)"); });
                } else { $("#gestor").val("Colaborador sem Seção/Coligada"); }
            }, 150);
        }

        if (selectedItem.inputId == "txtNovoFuncao") { $("#txtNovoCodFuncao").val(selectedItem.CODIGO || ""); $("#cboNovaFuncao").val(selectedItem.CBO2002 || ""); }
        if (selectedItem.inputId == "txtMotivoFuncao") { $("#txtCodMotivoFuncao").val(selectedItem.CODINTERNO || ""); }
        
        if (selectedItem.inputId == "CpNovoHorario") {
            $("#CpNovoCodHorario").val(selectedItem.CODIGO || "");
            if(window["CpIndiceCodHorario"]) { window["CpIndiceCodHorario"].clear(); window["CpIndiceCodHorario"].disable(true); }
            var codHorario = selectedItem.CODIGO;
            var codColigada = selectedItem.CODCOLIGADA || $("#empresaColab").val();
            if (codHorario && codColigada) { window["CpIndiceCodHorario"].disable(false); reloadZoomFilterValues("CpIndiceCodHorario", "CODCOLIGADA," + codColigada + ",CODHORARIO," + codHorario); }
        }

        if (selectedItem.inputId == "txtMotivoSalario") { $("#txtCodMotivoSalario").val(selectedItem.CODINTERNO || ""); }
        if (selectedItem.inputId == "txtMotivoSecao") { $("#txtCodMotivoSecao").val(selectedItem.CODINTERNO || ""); }
    }

    function removedZoomItem(removedItem) {
        if (removedItem.inputId == "empresaColab") {
            if(window["dptoObraColab"]) { window["dptoObraColab"].clear(); window["dptoObraColab"].disable(true); }
            if(window["CodNovaSecao"]) { window["CodNovaSecao"].clear(); window["CodNovaSecao"].disable(true); }
            if(window["nomeColaborador"]) { window["nomeColaborador"].clear(); window["nomeColaborador"].disable(true); }
            $("#txtCodSecaoOri, #txtSecOrig, #txtCodMotivoSecao, #txtCodFuncao, #CargoCol, #cboFuncaoAtual, #CodHorAtual, #DescHoraAtual, #IndiceAtual, #CpNovoCodHorario, #Salario, #cpJornadaMensal, #NovoSalario, #cpNovaJornadaMensal, #txtCodMotivoSalario").val("");
            if(window["txtMotivoSecao"]) { window["txtMotivoSecao"].clear(); }
            if(window["CpNovoHorario"]) { window["CpNovoHorario"].clear(); }
            if(window["CpIndiceCodHorario"]) { window["CpIndiceCodHorario"].clear(); window["CpIndiceCodHorario"].disable(true); }
            if(window["txtMotivoSalario"]) { window["txtMotivoSalario"].clear(); }
        }

        if (removedItem.inputId == "dptoObraColab") {
            if(window["nomeColaborador"]) { window["nomeColaborador"].clear(); window["nomeColaborador"].disable(true); }
            $("#txtCodSecaoOri, #txtSecOrig, #txtCodMotivoSecao, #txtCodFuncao, #CargoCol, #cboFuncaoAtual, #CodHorAtual, #DescHoraAtual, #IndiceAtual, #CpNovoCodHorario, #Salario, #cpJornadaMensal, #NovoSalario, #cpNovaJornadaMensal, #txtCodMotivoSalario").val("");
            if(window["txtMotivoSecao"]) { window["txtMotivoSecao"].clear(); }
            if(window["CpNovoHorario"]) { window["CpNovoHorario"].clear(); }
            if(window["CpIndiceCodHorario"]) { window["CpIndiceCodHorario"].clear(); window["CpIndiceCodHorario"].disable(true); }
            if(window["txtMotivoSalario"]) { window["txtMotivoSalario"].clear(); }
        }

        if (removedItem.inputId == "nomeColaborador") {
            $("#matricula, #cargo, #dataAdmissao, #gestor, #tipoFuncionario, #codSituacao, #salarioColaborador, #horarioColaborador").val("");
            $("#txtCodMotivoSecao, #txtCodFuncao, #CargoCol, #cboFuncaoAtual, #CodHorAtual, #DescHoraAtual, #IndiceAtual, #CpNovoCodHorario, #Salario, #cpJornadaMensal, #NovoSalario, #cpNovaJornadaMensal, #txtCodMotivoSalario").val("");
            if(window["txtMotivoSecao"]) { window["txtMotivoSecao"].clear(); }
            if(window["CpNovoHorario"]) { window["CpNovoHorario"].clear(); }
            if(window["CpIndiceCodHorario"]) { window["CpIndiceCodHorario"].clear(); window["CpIndiceCodHorario"].disable(true); }
            if(window["txtMotivoSalario"]) { window["txtMotivoSalario"].clear(); }
        }

        if (removedItem.inputId == "CodNovaSecao") { $("#DesNovaSecao, #cpNovoGestor, #codGestorDestino").val(""); }
        if (removedItem.inputId == "txtMotivoSecao") { $("#txtCodMotivoSecao").val(""); }
        if (removedItem.inputId == "txtNovoFuncao") { $("#txtNovoCodFuncao, #cboNovaFuncao").val(""); }
        if (removedItem.inputId == "txtMotivoFuncao") { $("#txtCodMotivoFuncao").val(""); }
        if (removedItem.inputId == "CpNovoHorario") { $("#CpNovoCodHorario").val(""); if(window["CpIndiceCodHorario"]) { window["CpIndiceCodHorario"].clear(); window["CpIndiceCodHorario"].disable(true); } }
        if (removedItem.inputId == "txtMotivoSalario") { $("#txtCodMotivoSalario").val(""); }
    }
</script>
</body>
</html>
